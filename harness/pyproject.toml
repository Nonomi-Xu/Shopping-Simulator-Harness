[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shopping-simulator-harness"
version = "0.6.0"
description = "Multi-agent shopping advisor with audited planning, observation, BM25 and vector retrieval"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.7,<3",
]

[project.optional-dependencies]
vector = [
    "numpy>=1.24,<3",
]
dev = [
    "duckdb>=1.0,<2",
]

[project.scripts]
shopping-harness-prepare = "src.data.pipeline:main"
shopping-agent = "src.harness.cli:entrypoint"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["."]
include = ["src", "src.*"]
namespaces = true

[tool.setuptools.package-data]
"src.harness.branch.episodes" = ["prompts/*.md", "topics.json"]

[tool.setuptools.data-files]
"share/shopping-simulator-harness/skills/shopping-agent" = [
    "skills/shopping-agent/SKILL.md",
]
"share/shopping-simulator-harness/skills/shopping-agent/agents" = [
    "skills/shopping-agent/agents/openai.yaml",
]
"share/shopping-simulator-harness/skills/shopping-agent/references" = [
    "skills/shopping-agent/references/agent-definition.md",
    "skills/shopping-agent/references/shopping-strategy.md",
    "skills/shopping-agent/references/tool-contract.md",
]
